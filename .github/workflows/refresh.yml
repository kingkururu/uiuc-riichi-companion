# Runs in the public site repository (kingkururu/uiuc-riichi-companion). `npm run deploy` copies it
# there from site-workflows/ in the app's source repository, which is the copy to edit.
#
# Every day: download the current semester's ranked games from the club site with the bundled importer
# (tools/import-club.mjs) and publish the new data file if anything changed. The site loads the data
# files when it opens, so no rebuild (and no access to the private source) is needed.
name: Refresh club data

on:
  schedule:
    # 09:00 UTC = 4 AM in Champaign (CDT; 3 AM after daylight saving ends).
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

env:
  # The semester being played; change it (and deploy) when a new semester starts.
  CURRENT_SEMESTER: fa26

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download the club's games
        run: node tools/import-club.mjs "$CURRENT_SEMESTER"

      - name: Publish if there are new games
        run: |
          # Every download has a new timestamp, so compare game counts instead of files.
          count='const fs = require("fs"); try { console.log(JSON.parse(fs.readFileSync(0, "utf8")).games.length) } catch { console.log(-1) }'
          before=$(git show "HEAD:club-data/$CURRENT_SEMESTER.json" 2>/dev/null | node -e "$count")
          after=$(node -e "$count" < "club-data/$CURRENT_SEMESTER.json")
          if [ "$before" = "$after" ]; then
            echo "No new games ($after); the site is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add club-data
          git commit -m "Refresh $CURRENT_SEMESTER club data: $before → $after games"
          git push
